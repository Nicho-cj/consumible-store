server {
    listen 80;
    server_name consumiblestore.ordenes.local; # Dominio local del servidor (asignar en hosts + IP estatica en el router)

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Configuración para que el SPA (React Router) funcione al recargar subrutas
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy hacia el Backend de Node.js (mismo dominio con prefijo /api)
    # Sin slash final en proxy_pass para conservar el prefijo /api -> /api/auth, /api/ordenes ...
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;

        proxy_redirect off;
    }

    # 3. Proxy del WebSocket (tiempo real) -> mismo backend
    location /ws {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 3600s;
    }
}