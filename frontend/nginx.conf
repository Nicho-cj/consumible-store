server {
    listen 80;
    server_name comestible-store.ordenes; # Tu dominio local

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Configuración para que el SPA (React Router) funcione al recargar subrutas
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy hacia el Backend de Node.js
    location /api/ {
        proxy_pass http://backend:3000/; # Nombre del servicio en Docker Compose
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}