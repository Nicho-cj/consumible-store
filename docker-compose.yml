name: consumiblestore-ordenes
services:
  database:
    image: postgres:latest
    container_name: ordenes_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    container_name: ordenes_backend
    restart: unless-stopped
    ports:
      - "${BACK_PORT}:3000"
    environment:
      BACK_PORT: ${BACK_PORT}
      BACK_CORS: ${BACK_CORS}
      BACK_JWT_KEY: ${BACK_JWT_KEY}

      FRONT_HOST: ${FRONT_HOST}
      FRONT_PORT: ${FRONT_PORT}

      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_URI: ${DB_URI}

      NODE_ENV: "production"
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: ordenes_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
